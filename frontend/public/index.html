<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LastMile — Delivery Route Planning</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>">
</head>
<body>

<div class="app-shell">

  <!-- ── Topbar ── -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="8" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M19 12h4l3 4v5h-7V12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="6"  cy="23" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="22" cy="23" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 14h8M4 11h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      LASTMILE
    </div>
    <div class="topbar-divider"></div>
    <span class="topbar-title">Delivery Route Planning System</span>
    <div class="topbar-spacer"></div>
    <div class="topbar-status">SYSTEM ONLINE</div>
    <div class="topbar-time" id="topbar-clock">00:00:00</div>
  </header>

  <!-- ── Sidebar ── -->
  <nav class="sidebar">
    <span class="sidebar-section-label">Operations</span>

    <div class="nav-item active" data-page="dashboard">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </div>

    <div class="nav-item" data-page="deliveries">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="1" y="3" width="15" height="13"/>
        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      Deliveries
    </div>

    <div class="nav-item" data-page="drivers">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Drivers
    </div>

    <div class="nav-item" data-page="routes">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Route Planner
    </div>

    <span class="sidebar-section-label" style="margin-top:16px">System</span>

    <div class="nav-item" style="cursor:default;opacity:0.5">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      Live Tracking
      <span style="font-size:0.6rem;color:var(--text-muted);margin-left:auto;background:var(--border);padding:1px 5px;border-radius:3px">SOON</span>
    </div>

    <div class="nav-item" style="cursor:default;opacity:0.5">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
      </svg>
      Analytics
      <span style="font-size:0.6rem;color:var(--text-muted);margin-left:auto;background:var(--border);padding:1px 5px;border-radius:3px">SOON</span>
    </div>

    <!-- Depot info -->
    <div style="margin-top:auto;padding:16px;border-top:1px solid var(--border)">
      <div style="font-family:var(--font-mono);font-size:0.6rem;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Depot</div>
      <div style="font-size:0.75rem;color:var(--text-secondary);font-weight:500">HQ — New Delhi</div>
      <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);margin-top:2px">28.6139° N, 77.2090° E</div>
    </div>
  </nav>

  <!-- ── Main Content ── -->
  <main class="main-content" id="main-content">
    <div class="loading-overlay">
      <div class="spinner"></div>
    </div>
  </main>

</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- Compiled TypeScript -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
